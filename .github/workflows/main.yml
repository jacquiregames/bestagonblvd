name: Build Windows Executable

on:
  workflow_dispatch: # Allows you to manually trigger the build from GitHub

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 8

      - name: Build Frontend (React/Vite)
        run: |
          pnpm install
          pnpm run build

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pyinstaller

      - name: Build Executable with PyInstaller
        # The --add-data flag embeds the React 'dist' folder directly into the .exe
        run: |
          pyinstaller --name "BestagonBlvd" --onefile --add-data "dist;dist" backend/app/main.py

      - name: Upload Windows Executable
        uses: actions/upload-artifact@v4
        with:
          name: BestagonBlvd-Windows
          path: dist/BestagonBlvd.exe

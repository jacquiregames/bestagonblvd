name: Build macOS Executable

on:
  workflow_dispatch: 

jobs:
  build-mac:
    strategy:
      matrix:
        # This tells GitHub to run this entire job twice simultaneously:
        # macos-latest runs on an Apple Silicon (M-Series) processor
        # macos-13 runs on an Intel processor
        include:
          - os: macos-latest
            arch_name: AppleSilicon
          - os: macos-13
            arch_name: Intel

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Build Frontend (React/Vite)
        run: |
          pnpm install
          pnpm run build

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pyinstaller

      - name: Build Executable with PyInstaller
        # IMPORTANT: Notice the COLON in "dist:dist" instead of a semicolon!
        run: |
          pyinstaller --name "BestagonBlvd" --onefile --add-data "dist:dist" backend/app/main.py

      - name: Upload macOS Executable
        uses: actions/upload-artifact@v6
        with:
          name: BestagonBlvd-Mac-${{ matrix.arch_name }}
          path: dist/BestagonBlvd
